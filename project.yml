name: Frij
options:
  bundleIdPrefix: com.frij
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    majorVersion: 8.0.0

targets:
  Frij:
    type: application
    platform: iOS
    sources:
      - path: Frij
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # Ad-hoc sign simulator builds. Unsigned apps have no keychain access,
        # which Firebase Auth and Google Sign-In need to store the session.
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    info:
      path: Frij/Info.plist
      properties:
        CFBundleDisplayName: Frij
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Frij listens when you tap the mic so you can add food by talking.
        NSSpeechRecognitionUsageDescription: Frij turns what you say into text on your device to add food to your fridge.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Google Sign-In redirects back to the app through this URL scheme.
        # The value comes from REVERSED_CLIENT_ID in GoogleService-Info.plist,
        # copied into Config/Secrets.xcconfig.
        CFBundleURLTypes:
          - CFBundleURLName: google-sign-in
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAILogic
      - package: Firebase
        product: FirebaseAppCheck
      - package: GoogleSignIn
        product: GoogleSignIn
